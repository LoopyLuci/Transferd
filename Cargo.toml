# Transferd core: the protocol and its reference implementation, as one Cargo workspace.
#
# This workspace has no dependency outside this repository. The same crates are
# carried, byte for byte, by TransferDaemon (see core.manifest and scripts/sync-core.sh).

[workspace]
resolver = "2"
members = [
    "crates/ring-channel",
    "crates/transferd-crypto",
    "crates/relayd",
    "crates/transferd-core",
    "crates/transferd-dns",
    "crates/transferd-overlay",
    "crates/transferd-relay",
    "crates/transferd-cat",
    "crates/transferd-conformance",
]
# The fuzz targets are a separate cargo-fuzz project (nightly toolchain, libFuzzer).
exclude = ["fuzz"]

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
missing_docs_in_private_items = "allow"

[workspace.dependencies]
bytes = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
nix = { version = "0.29", features = ["mman"] }
libc = "0.2"
thiserror = "2"
parking_lot = "0.12"
futures = "0.3"
rand = "0.8"
hex = "0.4"
aes-gcm = "0.10"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[profile.test]
# The throughput and timing tests in transferd-overlay measure the protocol over emulated links.
# An unoptimised build spends more CPU on the crypto and framing than the emulated link allows, so
# those tests measured the debug build, not the protocol (55% of the link in debug, 93% optimised).
# Optimising the test profile keeps `cargo test` measuring what the tests are about. Debug
# assertions and overflow checks stay on.
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
